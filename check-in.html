<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Check-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ["Playfair Display", "serif"],
              sans: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .animate-fade-in-up {
        animation: fadeInUp 0.6s ease-out;
      }

      .animate-fade-in {
        animation: fadeIn 0.4s ease-out;
      }

      .animate-delay-200 {
        animation-delay: 0.2s;
        animation-fill-mode: both;
      }

      .animate-delay-400 {
        animation-delay: 0.4s;
        animation-fill-mode: both;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-gradient-to-br from-rose-50 via-pink-50 to-purple-50 font-sans relative"
  >
    <!-- Background Image -->
    <div
      class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-20"
    >
      <img
        src="./images/event-gal-7.jpg"
        alt="Elegant celebration background"
        class="w-full h-full object-cover"
        loading="lazy"
        decoding="async"
      />
    </div>
   

    <!-- CENTERING WRAPPER -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">    <h1
            class="font-serif text-5xl md:text-8xl font-bold mb-6 bg-gradient-to-r from-black to-purple-500 bg-clip-text text-transparent"
          >
            Zainab & Bolaji
          </h1>
      <div class="max-w-md w-full">
        <!-- Header / Status Area -->
        <div class="animate-fade-in mb-6 text-center">
          <div
            id="statusBadge"
            class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium mb-2"
          >
            <div class="w-2 h-2 rounded-full mr-2"></div>
           
          </div>
          <h1 class="text-2xl font-serif font-semibold text-gray-800">
            Wedding Check-In
          </h1>
        </div>

        <!-- Guest Information Card -->
        <div
          class="font-bold animate-fade-in-up animate-delay-200 bg-white/10 backdrop-blur-sm rounded-2xl shadow-lg border border-white/20 p-6 mb-6"
        > <span id="statusText" class="text-center">Awaiting Check-In</span>
          <h2 class="text-lg font-serif font-semibold text-gray-800 mb-4">
            Guest Information
          </h2>

          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1"
                >Guest Name</label
              >
              <div class="bg-gray-50 rounded-lg p-3 border">
                <span id="guestName" class="text-gray-800 font-medium">
                  [Guest name will load here]
                </span>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1"
                >Party Size</label
              >
              <div class="bg-gray-50 rounded-lg p-3 border">
                <span id="partySize" class="text-gray-800 font-medium">
                  [Party size will load here]
                </span>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-600 mb-1"
                >RSVP Reference</label
              >
              <div class="bg-gray-50 rounded-lg p-3 border">
                <span id="rsvpToken" class="text-gray-800 font-mono text-sm">
                  [Token will load here]
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Area -->
        <div class="animate-fade-in-up animate-delay-400 mb-6">
          <button
            id="checkInButton"
            class="w-full bg-rose-500 hover:bg-rose-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-semibold py-4 px-6 rounded-xl transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg"
            onclick="handleCheckInClick()"
          >
            <span id="buttonText">Check In Guest</span>
          </button>
        </div>

        <!-- Info Message -->
        <div
          class="animate-fade-in-up animate-delay-400 bg-blue-50 border border-blue-200 rounded-xl p-4"
        >
          <div class="flex items-start">
            <svg
              class="w-5 h-5 text-blue-500 mt-0.5"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                fill-rule="evenodd"
                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                clip-rule="evenodd"
              ></path>
            </svg>
            <div class="ml-3">
              <p id="infoMessage" class="text-sm text-blue-700">
                Please present this screen to the event staff for check-in.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 🔒 JS untouched -->
    <!-- your entire script block remains exactly the same -->
  </body>
</html>
